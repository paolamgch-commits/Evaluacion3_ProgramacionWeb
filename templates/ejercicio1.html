
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Notas</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="contenedor">
        <h1>Formulario de Notas</h1>

        <form method="POST" action="{{ url_for('ejercicio1') }}">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" name="nota1"
                   min="10" max="70" step="any" required>

            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" name="nota2"
                   min="10" max="70" step="any" required>

            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" name="nota3"
                   min="10" max="70" step="any" required>

            <label for="asistencia">Asistencia (%):</label>
            <input type="number" id="asistencia" name="asistencia"
                   min="0" max="100" step="any" required>

            <button type="submit">Enviar</button>
        </form>

        {% if promedio is not none %}
            <div class="resultado">
                <h2>Resultado</h2>
                <p>Promedio: {{ promedio }}</p>
                <p>Estado: <strong>{{ estado }}</strong></p>
            </div>
        {% endif %}

        <p>
            <a href="{{ url_for('inicio') }}">
                Volver al menú principal
            </a>
        </p>
    </main>
</body>
</html>
