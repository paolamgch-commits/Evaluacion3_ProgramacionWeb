
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="contenedor">
        <h1>Comparación de Nombres</h1>

        <form method="POST" action="{{ url_for('ejercicio2') }}">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1"
                   name="nombre1" required>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2"
                   name="nombre2" required>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3"
                   name="nombre3" required>

            <button type="submit">Comparar nombres</button>
        </form>

        {% if error %}
    <div class="error">
        <p>{{ error }}</p>
    </div>
{% endif %}

        {% if nombre_mayor is not none %}
            <div class="resultado">
                <h2>Resultado</h2>
                <p>Nombre más largo:
                   <strong>{{ nombre_mayor }}</strong></p>
                <p>Cantidad de caracteres:
                   <strong>{{ cantidad }}</strong></p>
            </div>
        {% endif %}

        <p>
            <a href="{{ url_for('inicio') }}">
                Volver al menú principal
            </a>
        </p>
    </main>
</body>
</html>
